version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Raises [compat] bounds in Project.toml when new dependency releases fall
  # outside them. test/Project.toml is deliberately excluded: Dependabot would pin
  # test deps to their latest releases, which older Julia versions in the CI
  # matrix cannot resolve.
  - package-ecosystem: julia
    directory: /
    schedule:
      interval: weekly
    groups:
      julia:
        patterns: ['*']
